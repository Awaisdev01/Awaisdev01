<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 320" width="1240" height="320" role="img" aria-label="Awais Ur Rehman — Senior Software Engineer. Mobile, Full-Stack and AI Systems.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B0C0F"/><stop offset=".6" stop-color="#10170A"/><stop offset="1" stop-color="#1D2D0B"/>
  </linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B7FF45"/><stop offset="1" stop-color="#6FD13A"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#B7FF45" stop-opacity=".35"/><stop offset="1" stop-color="#B7FF45" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/>
  </pattern>
  <clipPath id="r"><rect width="1240" height="320" rx="20"/></clipPath>
</defs>
<style>
  .name{font:800 62px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;fill:#fff;letter-spacing:-1px}
  .sub{font:600 26px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;fill:#B7FF45}
  .tag{font:400 17px 'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif;fill:#8B93A1;letter-spacing:.5px}
  .mono{font-family:'SF Mono','JetBrains Mono',Consolas,'Liberation Mono',monospace}
  @keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
  .ul{stroke-dasharray:400;animation:draw 1.4s ease-out .3s both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .chip{animation:fade .6s ease-out both}
  .t1{animation:fade .8s ease-out .1s both} .t2{animation:fade .8s ease-out .35s both} .t3{animation:fade .8s ease-out .5s both}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  .glow{animation:pulse 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .fl{animation:float 5s ease-in-out infinite}
  @keyframes bar{0%,100%{transform:scaleX(.55)}50%{transform:scaleX(1)}}
  .bar{transform-box:fill-box;transform-origin:left center;animation:bar 3.2s ease-in-out infinite}
</style>
<g clip-path="url(#r)">
  <rect width="1240" height="320" fill="url(#bg)"/>
  <rect width="1240" height="320" fill="url(#grid)"/>
  <circle class="glow" cx="1010" cy="160" r="230" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1237" height="317" rx="19" fill="none" stroke="#B7FF45" stroke-opacity=".25" stroke-width="3"/>

  <text class="name t1" x="70" y="132">Awais Ur Rehman</text>
  <path class="ul" d="M72 152H430" stroke="url(#acc)" stroke-width="4" stroke-linecap="round"/>
  <text class="sub t2" x="70" y="198">Senior Software Engineer</text>
  <text class="tag t3" x="70" y="232">MOBILE  ·  FULL-STACK  ·  AI SYSTEMS</text>
  <g class="chip" style="animation-delay:0.6s"><rect x="70" y="252" width="97" height="30" rx="15" fill="#171B22" stroke="#2C333D"/><circle cx="85" cy="267" r="3.5" fill="#B7FF45"/><text x="96" y="272" class="mono" font-size="13" fill="#E8EAED">Flutter</text></g><g class="chip" style="animation-delay:0.7s"><rect x="177" y="252" width="81" height="30" rx="15" fill="#171B22" stroke="#2C333D"/><circle cx="192" cy="267" r="3.5" fill="#B7FF45"/><text x="203" y="272" class="mono" font-size="13" fill="#E8EAED">Swift</text></g><g class="chip" style="animation-delay:0.8s"><rect x="268" y="252" width="89" height="30" rx="15" fill="#171B22" stroke="#2C333D"/><circle cx="283" cy="267" r="3.5" fill="#B7FF45"/><text x="294" y="272" class="mono" font-size="13" fill="#E8EAED">Kotlin</text></g><g class="chip" style="animation-delay:0.9s"><rect x="368" y="252" width="73" height="30" rx="15" fill="#171B22" stroke="#2C333D"/><circle cx="383" cy="267" r="3.5" fill="#B7FF45"/><text x="394" y="272" class="mono" font-size="13" fill="#E8EAED">Dart</text></g><g class="chip" style="animation-delay:1.0s"><rect x="450" y="252" width="122" height="30" rx="15" fill="#171B22" stroke="#2C333D"/><circle cx="465" cy="267" r="3.5" fill="#B7FF45"/><text x="476" y="272" class="mono" font-size="13" fill="#E8EAED">TypeScript</text></g><g class="chip" style="animation-delay:1.1s"><rect x="582" y="252" width="89" height="30" rx="15" fill="#171B22" stroke="#2C333D"/><circle cx="597" cy="267" r="3.5" fill="#B7FF45"/><text x="608" y="272" class="mono" font-size="13" fill="#E8EAED">Python</text></g>

  <g transform="translate(930,26)">
    <rect x="0" y="0" width="170" height="268" rx="30" fill="#0F1217" stroke="#B7FF45" stroke-opacity=".55" stroke-width="2"/>
    <rect x="65" y="11" width="40" height="8" rx="4" fill="#1E232B"/>
    <rect x="16" y="38" width="138" height="72" rx="14" fill="url(#acc)" opacity=".92"/>
    <circle cx="40" cy="62" r="11" fill="#0B0C0F" opacity=".75"/>
    <rect x="58" y="54" width="70" height="7" rx="3.5" fill="#0B0C0F" opacity=".7"/>
    <rect x="58" y="68" width="46" height="7" rx="3.5" fill="#0B0C0F" opacity=".45"/>
    <rect x="30" y="92" width="110" height="6" rx="3" fill="#0B0C0F" opacity=".35"/>
    <rect class="bar" x="16" y="128" width="138" height="10" rx="5" fill="#242932"/>
    <rect class="bar" x="16" y="152" width="108" height="10" rx="5" fill="#242932" style="animation-delay:.4s"/>
    <rect class="bar" x="16" y="176" width="124" height="10" rx="5" fill="#242932" style="animation-delay:.8s"/>
    <rect class="bar" x="16" y="200" width="84" height="10" rx="5" fill="#242932" style="animation-delay:1.2s"/>
    <circle cx="45" cy="242" r="7" fill="#B7FF45"/><circle cx="85" cy="242" r="7" fill="#242932"/><circle cx="125" cy="242" r="7" fill="#242932"/>
  </g>
  <g class="fl" style="animation-delay:0s"><g transform="translate(795,58)"><rect width="84" height="30" rx="15" fill="#171B22" stroke="#B7FF45" stroke-opacity=".55"/><text x="42" y="20" text-anchor="middle" class="mono" font-size="13" fill="#B7FF45">Flutter</text></g></g>
  <g class="fl" style="animation-delay:1.2s"><g transform="translate(1112,96)"><rect width="68" height="30" rx="15" fill="#171B22" stroke="#B7FF45" stroke-opacity=".55"/><text x="34" y="20" text-anchor="middle" class="mono" font-size="13" fill="#B7FF45">Swift</text></g></g>
  <g class="fl" style="animation-delay:2.1s"><g transform="translate(800,226)"><rect width="76" height="30" rx="15" fill="#171B22" stroke="#B7FF45" stroke-opacity=".55"/><text x="38" y="20" text-anchor="middle" class="mono" font-size="13" fill="#B7FF45">Kotlin</text></g></g>
  <g class="fl" style="animation-delay:0.7s"><g transform="translate(1118,214)"><rect width="44" height="30" rx="15" fill="#171B22" stroke="#B7FF45" stroke-opacity=".55"/><text x="22" y="20" text-anchor="middle" class="mono" font-size="13" fill="#B7FF45">AI</text></g></g>
</g>
</svg>