<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 230" width="1240" height="230" role="img" aria-label="Hallucination Hunter: a browser game where you catch the claims an AI summary got wrong" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.h{font:700 34px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#E8EAED;letter-spacing:-.5px}
.p{font:400 16px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9AA3B2}
.b{font:700 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#0B0C0F}
.d{font:15px Georgia,'Palatino Linotype',serif;fill:#E8EAED}
.m{font:13px 'SF Mono',Consolas,'Liberation Mono',monospace;fill:#9AA3B2}.mv{font:13px 'SF Mono',Consolas,'Liberation Mono',monospace;fill:#E8EAED}
@keyframes hl{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hl{transform-box:fill-box;transform-origin:left;animation:hl .9s ease-out .6s both}
</style>
<rect x="1.5" y="1.5" width="1237" height="227" rx="16" fill="#0F1217" stroke="#262B33" stroke-width="2"/>
<text class="h" x="40" y="80">Hallucination Hunter</text>
<text class="p" x="40" y="114">Catch the claims an AI summary got wrong.</text>
<text class="p" x="40" y="138">Name the fact that contradicts each claim. Four rounds, sixty seconds each.</text>
<rect x="40" y="164" width="130" height="42" rx="8" fill="#B7FF45"/>
<text class="b" x="105" y="190" text-anchor="middle">Play now</text>
<rect x="540" y="28" width="380" height="174" rx="10" fill="#14171C" stroke="#262B33"/>
<text class="d" x="562" y="62">Orbit Notes 2.4.0 shipped on March 12.</text>
<rect class="hl" x="558" y="76" width="338" height="26" rx="3" fill="#B7FF45" fill-opacity=".2"/>
<rect x="558" y="100" width="338" height="2" fill="#B7FF45"/>
<text class="d" x="562" y="95">The update trims the app to 24 MB.</text>
<text class="d" x="562" y="130">Offline mode and a dark theme are new.</text>
<text class="d" x="562" y="164">The legacy export option has been removed.</text>
<rect x="944" y="28" width="256" height="174" rx="10" fill="#0F1217" stroke="#262B33"/>
<text class="m" x="962" y="56">facts.txt</text>
<rect x="944" y="76" width="3" height="26" fill="#B7FF45"/><rect x="947" y="76" width="253" height="26" fill="#B7FF45" fill-opacity=".08"/>
<text class="m" x="962" y="94">app_size</text><text class="mv" x="1056" y="94">38 MB</text>
<text class="m" x="962" y="124">version</text><text class="mv" x="1056" y="124">2.4.0</text>
<text class="m" x="962" y="154">removed</text><text class="mv" x="1056" y="154">legacy export</text>
<text class="m" x="962" y="184">released</text><text class="mv" x="1056" y="184">2026-03-12</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>